[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[preview]
max_width = 2000
max_height = 2000

[mgr]
sort_by = "alphabetical"
title_format = "yazi - {cwd}"

[[plugin.prepend_fetchers]]
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"

[plugin]
prepend_preloaders = [
  { mime = "image/png", run = "magick --bg=red" },
  { mime = "image/svg+xml", run = "svg --bg=blue" }
]
prepend_previewers = [
  { mime = "image/png", run = "magick --bg=red" },
  { mime = "image/svg+xml", run = "svg --bg=blue" }
]

[tasks]
suppress_preload = true
